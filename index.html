<!DOCTYPE html>
<html>
<head>
	<style>
		:root{
			--color-grey-900: #212121;
			--color-grey-800: #424242;
			--color-white: #FFFFFF;
			--color-pink-500: #E91E63;
			--color-pink-400: #EC407A;
		}
		body{
			margin: 0;
			font-family: sans-serif;
		}
		#contenedor{
			background-color: var(--color-grey-900);
			height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
		}
		#caja-login{
			background-color: var(--color-grey-800);
			width: 100%;
			max-width: 400px;
			padding: 40px 20px;
			margin: 0 16px;
			box-sizing: border-box;
			border-radius: 8px;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			gap: 16px;
			box-shadow: 0px 3px 6px rgba(0, 0, 0, 0.16),
						0px 3px 6px rgba(0,0,0,0.23);
		}
		h2{
			color: var(--color-white);
		}
		input,button{
			width: 80%;
			padding: 12px;
			font-size: 16px;
			outline: none;
			border: none;
			color: var(--color-white);
			box-sizing: border-box;
		}
		input{
			background-color: var(--color-grey-800);
			border-bottom: 2px solid var(--color-pink-500);
		}
		input::placeholder{
			color:var(--color-white);
		}
		button{
			background-color: var(--color-pink-500);
		}
		button:hover{
			background-color: var(--color-pink-400);
			cursor: pointer;
		}
	</style>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>login</title>
</head>
<body>
	<div id="contenedor">
		<form id="caja-login">
			<h2>login</h2>
			<input type="email" placeholder="correo">
			<input type="password" placeholder="contraseña">
			<button>login</button>
		</form>
	</div>
</body>
</html>
